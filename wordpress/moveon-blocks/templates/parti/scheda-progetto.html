<div class="mo-pf-modal" role="dialog" aria-modal="true" aria-labelledby="mo-pfm-title" data-lenis-prevent hidden>
  <div class="mo-pfm-bg"></div>
  <div class="mo-pfm-bar">
    <button type="button" class="mo-pfm-btn mo-pfm-close">{{> icona-chiudi}}Chiudi</button>
    <div class="mo-pfm-nav">
      <button type="button" class="mo-pfm-btn mo-pfm-prev" aria-label="Progetto precedente">{{> icona-prec}}</button>
      <button type="button" class="mo-pfm-btn mo-pfm-next" aria-label="Progetto successivo">{{> icona-succ}}</button>
    </div>
  </div>
  <div class="mo-pfm-inner">
    <span class="mo-pfm-cover"></span>
    <div class="mo-pfm-head mo-pfm-anim">
      <span class="mo-pfm-badge"></span>
      <h2 class="mo-pfm-title" id="mo-pfm-title"></h2>
      <p class="mo-pfm-cat"></p>
    </div>
    <div class="mo-pfm-blocks">
      <div class="mo-pfm-block mo-pfm-anim"><h3>La richiesta</h3><p class="mo-pfm-brief"></p></div>
      <div class="mo-pfm-block mo-pfm-anim"><h3>Il nostro lavoro</h3><p class="mo-pfm-work"></p></div>
      <div class="mo-pfm-block mo-pfm-anim"><h3>Il risultato</h3><p class="mo-pfm-result"></p></div>
    </div>
    <div class="mo-pfm-gallery mo-pfm-anim" hidden></div>
  </div>
</div>
